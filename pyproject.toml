[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fix-casting"
version = "0.1.0"
description = "Cast a browser tab to Chromecast (tab mirroring, not dominant video)"
requires-python = ">=3.11"
dependencies = [
    "pychromecast>=14.0.0",
    "playwright>=1.40.0",
    "zeroconf>=0.131.0",
    "textual>=0.80",
]

[project.scripts]
cast = "cast_tab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cast_tab*"]

# uv otherwise keys a local-directory wheel primarily from pyproject.toml's
# mtime. Track both committed and dirty package-source changes as build inputs.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true } },
    { file = "cast_tab/**/*.py" },
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vendor"]

[tool.ruff.lint]
# Defaults (E4/E7/E9/F) + import sorting.
extend-select = ["I"]

[tool.mypy]
python_version = "3.11"
files = ["cast_tab"]
check_untyped_defs = true
warn_unused_ignores = true
# Libraries without type stubs.
[[tool.mypy.overrides]]
module = [
    "pychromecast.*",
    "playwright.*",
    "zeroconf.*",
    "textual.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end pipeline tests (need ffmpeg; run with -m slow)",
]
addopts = "-m 'not slow'"
